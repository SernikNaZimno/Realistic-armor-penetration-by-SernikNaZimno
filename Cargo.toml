[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"

# Dependency direction is strictly downwards: front ends -> app -> services -> domain.
# Every dependency, internal or external, is declared here once and added
# in the milestone that first uses it.
[workspace.dependencies]
rap-analysis = { path = "crates/rap-analysis" }
rap-domain = { path = "crates/rap-domain" }
rap-geometry = { path = "crates/rap-geometry" }
rap-materials = { path = "crates/rap-materials" }
rap-solver = { path = "crates/rap-solver" }
glam = "0.30"
proptest = "1"
rayon = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# The validation tests run real simulations; keep them fast.
[profile.test]
opt-level = 2
